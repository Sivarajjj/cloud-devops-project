          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "title": "Total requests (5m)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(increase(http_requests_total{service=\"cloud-devops-service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
